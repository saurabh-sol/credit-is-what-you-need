# Render Blueprint for Kredit, with a persistent disk for the credit ledger.
#
# Credits, API keys and display names live in a SQLite file. Render's free plan
# has no disk, so that file is lost on every restart and deploy; use this
# Blueprint (Starter plan + disk) once real credits are at stake.
# Apply it from the Render dashboard: New > Blueprint > pick this repository.
services:
  - type: web
    name: kredit
    runtime: node
    plan: starter
    repo: https://github.com/saurabh-sol/credit-is-what-you-need
    branch: premium-polish
    # The ledger is one SQLite file, and rate limits and credit holds are kept in memory, so run a single instance.
    numInstances: 1
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    disk:
      name: kredit-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_PATH
        value: /var/data/kredit.db
      - key: SESSION_SECRET
        generateValue: true
      # Set these in the dashboard; they are secrets or deployment choices.
      # The WalletConnect ID is read at build time: redeploy after setting it.
      - key: NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID
        sync: false
      - key: UPSTREAM_BASE_URL
        sync: false
      - key: UPSTREAM_API_KEY
        sync: false
      - key: BLOCKSCOUT_API_KEY
        sync: false
